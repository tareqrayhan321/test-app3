name: Android Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "21"

jobs:
  assemble-debug:
    name: Assemble debug APK
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clothstore-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build and publish signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set release version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing repository secret: ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clothstore-release.jks"
          test -s "$RUNNER_TEMP/clothstore-release.jks"

      - name: Build unsigned production APK
        run: ./gradlew clean assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --stacktrace

      - name: Align and sign production APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing repository secret: KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing repository secret: KEY_ALIAS" >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing repository secret: KEY_PASSWORD" >&2; exit 1; }
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)
          test -n "$UNSIGNED_APK" || { echo "Unsigned release APK not found" >&2; exit 1; }
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$ZIPALIGN" || { echo "zipalign not found" >&2; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner not found" >&2; exit 1; }
          mkdir -p dist
          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" dist/clothstore-release-aligned.apk
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/clothstore-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "env:KEYSTORE_PASSWORD" --key-pass "env:KEY_PASSWORD" --out "dist/clothstore-${GITHUB_REF_NAME}.apk" dist/clothstore-release-aligned.apk
          rm -f dist/clothstore-release-aligned.apk
          "$APKSIGNER" verify --verbose "dist/clothstore-${GITHUB_REF_NAME}.apk"
          sha256sum "dist/clothstore-${GITHUB_REF_NAME}.apk" | tee dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="dist/clothstore-${GITHUB_REF_NAME}.apk"
          SHA=$(awk '{print $1}' dist/SHA256SUMS.txt)
          cat > dist/release-notes.md <<EOF
          Signed production APK for ${GITHUB_REF_NAME}.

          Commit: ${GITHUB_SHA}
          SHA-256: ${SHA}

          The release keystore is not included.
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --title "ClothStore ${GITHUB_REF_NAME}" --notes-file dist/release-notes.md
          fi

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: "@myapkLibraries"
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing repository secret: TELEGRAM_BOT_TOKEN" >&2; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing repository secret: TELEGRAM_CHAT_ID" >&2; exit 1; }
          test -n "$TELEGRAM_CHANNEL_ID" || { echo "Missing Telegram channel username" >&2; exit 1; }
          APK="dist/clothstore-${GITHUB_REF_NAME}.apk"
          test -s "$APK" || { echo "Release APK is missing or empty: $APK" >&2; exit 1; }
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          PERSONAL_RESPONSE_FILE="$RUNNER_TEMP/telegram-personal-response.json"
          curl --fail --silent --show-error --retry 3 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK}" \
            -F "caption=ClothStore ${GITHUB_REF_NAME} signed production APK. Release: ${RELEASE_URL}" \
            | tee "$PERSONAL_RESPONSE_FILE"
          TELEGRAM_MESSAGE_ID=$(jq -r '.result.message_id // empty' "$PERSONAL_RESPONSE_FILE")
          test -n "$TELEGRAM_MESSAGE_ID" || { echo "Telegram did not return a message_id" >&2; exit 1; }
          curl --fail --silent --show-error --retry 3 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/copyMessage" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "from_chat_id=${TELEGRAM_CHAT_ID}" \
            -F "message_id=${TELEGRAM_MESSAGE_ID}"

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/clothstore-release.jks"
